services:
  slproxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: slproxy:latest
    container_name: slproxy
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - SLPROXY_DATA_DIR=/data
      - SLPROXY_PORT=8080
      - SLPROXY_HOST=0.0.0.0
      - SLPROXY_DEFAULT_ROUTING_STRATEGY=fallback
      - SLPROXY_REQUIRE_API_KEY=false
    restart: unless-stopped
